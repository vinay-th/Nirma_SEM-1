<!doctype html>
<html>
  <head>
    <title>Form Validation</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      function validateForm() {
        let ip = $('#ip').val();
        let alpha = $('#alpha').val();
        let date = $('#date').val();
        let symbol = $('#symbol').val();
        let email = $('#email').val();
        let phone = $('#phone').val();
        let pass = $('#pass').val();
        let repass = $('#repass').val();

        if (
          ip == '' ||
          alpha == '' ||
          date == '' ||
          symbol == '' ||
          email == '' ||
          phone == '' ||
          pass == '' ||
          repass == ''
        ) {
          alert('All fields are required');
          return false;
        }

        if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)) {
          alert('Enter a valid IP address');
          return false;
        }

        if (!/^[a-zA-Z0-9]+$/.test(alpha)) {
          alert('Enter alphanumeric values only');
          return false;
        }

        if (!/^\d{2}\/\d{2}\/\d{4}$/.test(date)) {
          alert('Enter date in DD/MM/YYYY format');
          return false;
        }

        if (/[^a-zA-Z0-9 ]/.test(symbol)) {
          alert('Special symbols are not allowed');
          return false;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          alert('Enter a valid email');
          return false;
        }

        if (!/^\d{10,}$/.test(phone)) {
          alert('Phone number must contain at least 10 digits');
          return false;
        }

        if (pass != repass) {
          alert('Passwords do not match');
          return false;
        }

        alert('Form submitted successfully');
        return true;
      }

      $(document).ready(function () {
        $('#alpha').on('input', function () {
          this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');
        });

        $('#phone').on('input', function () {
          this.value = this.value.replace(/[^0-9]/g, '');
        });
      });
    </script>
  </head>
  <body>
    <h2>Form Validation</h2>

    <form onsubmit="return validateForm();">
      IP Address: <input type="text" id="ip" /><br /><br />
      Alphanumeric: <input type="text" id="alpha" /><br /><br />
      Date (DD/MM/YYYY): <input type="date" id="date" /><br /><br />
      No Special Symbols: <input type="text" id="symbol" /><br /><br />
      Email: <input type="text" id="email" /><br /><br />
      Phone Number: <input type="text" id="phone" /><br /><br />
      Password: <input type="password" id="pass" /><br /><br />
      Retype Password: <input type="password" id="repass" /><br /><br />

      <input type="submit" value="Submit" />
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
