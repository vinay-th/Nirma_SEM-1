<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greetings</title>
    <script>
      // A.	Write a JavaScript to display the current date, current time and display appropriate greeting message according to time slot. (Hint for message: Good Morning, 01/06/2023 09:00:00 AM)
      var currentDate = new Date();
      var hours = currentDate.getHours();
      var greeting;

      if (hours < 12) {
        greeting = 'Good Morning';
      } else if (hours < 18) {
        greeting = 'Good Afternoon';
      } else {
        greeting = 'Good Evening';
      }

      var formattedDate = currentDate.toLocaleDateString();
      var formattedTime = currentDate.toLocaleTimeString();

      document.write(
        '<h1>' +
          greeting +
          ', ' +
          '</h1>' +
          '<h2>' +
          formattedDate +
          ' ' +
          '<br/>' +
          formattedTime +
          '</h2>'
      );
    </script>
  </head>
  <body></body>
</html>
