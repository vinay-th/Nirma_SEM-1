<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
    <style>
      .container {
        justify-content: center;
        align-items: center;
        display: flex;
        flex-direction: column;
      }

      fieldset {
        border: 1px solid black;
        padding: 10px;
        max-width: full;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Customer Registration Page</h1>
      <form method="post" name="registration-form">
        <fieldset>
          <legend>Customer Information</legend>
          <label for="cus_id" class="label">Customer ID:</label>
          <input
            type="text"
            id="cus_id"
            name="cus_id"
            placeholder="Enter Customer ID"
          />
          <br />
          <br />
          <label for="cus_name" class="label">Customer Name:</label>
          <input
            type="text"
            id="cus_name"
            name="cus_name"
            placeholder="Enter Customer Name"
          />
          <br />
          <br />
          <label for="age" class="label">Age:</label>
          <input
            type="range"
            id="age"
            name="age"
            value="20"
            min="20"
            max="80"
            step="1"
            oninput="result.value = age.value"
          />
          <output id="result" name="result">20</output>
          <br />
          <br />
          <label for="gender" class="label">Gender:</label>
          <radiogroup id="gender" name="gender">
            <input type="radio" id="male" name="gender" value="male" />
            Male
            <input type="radio" id="female" name="gender" value="female" />
            Female
          </radiogroup>
          <br />
          <br />
          <label for="acc_type" class="label">Account Type:</label>
          <select id="acc_type" name="acc_type">
            <option value="savings">Savings</option>
            <option value="current">Current</option>
            <option value="fixed_deposit">Fixed Deposit</option>
          </select>
          <br />
          <br />
          <label for="photo" class="label">Upload Photo:</label>
          <input type="file" id="photo" name="photo" accept="image/*" />
          <br />
          <br />
          <label for="email" class="label">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter Email"
          />
          <br />
          <br />
          <label for="password" class="label">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
          />
          <br />
          <br />
          <label for="confirm-passord" class="label">Confirm Password:</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm Password"
          />
          <br />
          <br />
          <label for="home-url" class="label">Home URL:</label>
          <input
            type="url"
            id="home-url"
            name="home-url"
            placeholder="Enter Home URL"
          />
          <br />
          <br />
          <input type="reset" value="Reset" />
          <input type="submit" value="Submit" />
        </fieldset>
      </form>
    </div>
  </body>
</html>
