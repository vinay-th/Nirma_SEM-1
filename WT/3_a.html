<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        .container {
            justify-content: center;
            align-items: center;
            display: flex;
            flex-direction: column;
        }

        fieldset {
            border: 1px solid black;
            padding: 10px;
            max-width: full;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Student Registration Form</h1>
        <form method="post" name="registration-form">
            <fieldset>
                <legend>Student Information</legend>
                <label for="roll_no" class="label">Roll Number:</label>
                <input type="text" id="roll_no" name="roll_no" placeholder="Enter Roll No">
                <br /> <br />

                <label for="name" class="label">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter Name">
                <br /> <br />

                <label fpr="parent_name" class="label">Parent Name:</label>
                <input type="text" id="parent_name" name="parent_name" placeholder="Enter Parent Name">
                <br /> <br />

                <label for="your_image" class="label">Your Image:</label>
                <input type="file" id="your_image" name="your_image" accept="image/*">
                <br /> <br />

                <label for="gender" class="label">Gender:</label>
                <radiogroup id="gender" name="gender">
                    <label for="male">
                        <input type="radio" id="male" name="gender" value="male">
                        Male
                    </label>
                    <label for="female">
                        <input type="radio" id="female" name="gender" value="female">
                        Female
                    </label>
                </radiogroup>
                <br /> <br />

                <label for="semester" class="label">Semester:</label>
                <select id="semester" name="semester">
                    <option value="1">I</option>
                    <option value="2">II</option>
                    <option value="3">III</option>
                    <option value="4">IV</option>
                    <option value="5">V</option>
                    <option value="6">VI</option>
                </select>
                <br /> <br />

                <label for="Address" class="label">Address:</label>
                <textarea id="Address" name="Address" rows="4" cols="50"></textarea>
                <br /> <br />

                <label for="age" class="label">Age:</label>
                <input type="range" id="age" name="age" value="20" min="20" max="80" step="1"
                    oninput="result.value = age.value">
                <output id="result" name="result">20</output>
                <br /> <br />

                <input type="submit" value="Submit Form">
            </fieldset>
        </form>
    </div>
</body>

</html>
