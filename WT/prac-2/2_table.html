<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        img{
            max-width: 200px;
            max-height: 200px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <table border="3">
            <caption>Caption: Table example</caption>
            <thead>
                <tr>
                    <th colspan="4">Header 1</th>
                    <th colspan="3" rowspan="2" style="overflow: hidden;">Right corner of table</th>
                </tr>
                <tr>
                    <th colspan="3">Header 2</th>
                    <th colspan="1">Header 3</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="2">
                        <ol>
                            <li>Lists can be table</li>
                            <li>Images can be table</li>
                        </ol>
                    </td>
                    <td rowspan="7" colspan="1">Two Tall</td>
                    <td colspan="2">Two columns merged</td>
                </tr>
                <tr>
                    <td colspan="2">
                        <img src="img.jpeg" alt="planets">
                    </td>
                    <td rowspan="5">Data Here</td>
                    <td>
                        <b>
                        Caption:<br/>
                        Nested<br/> table<br/>
                        </b>
                        <table border="1">
                            <thead><tr><th>Header</th></tr></thead>
                            <tbody><tr><td>Cell data</td></tr></tbody>
                        </table>
                    </td>
                    <td colspan="2">
                        Multiple Lines<br/>
                        Line 1<br/>
                        Line 2<br/>
                        Line 3<br/>
                    </td>
                </tr>
                <tfoot>
                    <tr>
                        <th colspan="7">Table Footer</th>
                    </tr>
                </tfoot>
            </tbody>
        </table>
    </div>
</body>
</html>
