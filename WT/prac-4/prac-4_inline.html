<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Concepts</title>
</head>
<body>

    <h2>A. Font Properties</h2>
    <p style="font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; font-style: italic;">This text demonstrates font properties.</p>

    <h2>B. Background Properties</h2>
    <div style="background-color: lightblue; padding: 20px;">This div demonstrates background properties.</div>

    <h2>C. Border Styles & Figures</h2>
    
    <div>
        <div style="width: 200px; height: 200px; border: 2px dashed red; margin-bottom: 20px;"></div>
        <p>Figure 1</p>
    </div>

    <div>
        <div style="width: 200px; height: 100px; border-top: 4px solid black; border-left: 2px dotted black; border-bottom: 2px dotted black; border-right: 2px dotted black;"></div>
        <p>Figure 2</p>
    </div>

</body>
</html>
