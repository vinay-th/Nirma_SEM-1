<!doctype html>
<html>
  <head>
    <title>Font Properties</title>

    <style>
      .container {
        width: 600px;
        padding: 20px;
        border: 1px solid black;
        border-radius: 5px;
      }

      .font1 {
        font-family: Arial;
        font-size: 25px;
        font-style: italic;
        font-weight: bold;
        color: blue;
      }

      .font2 {
        font-family: Georgia;
        font-size: 20px;
        font-style: normal;
        font-weight: normal;
        color: green;
      }

      .font3 {
        font-family: 'Poppins', sans-serif;
        font-size: 22px;
        font-weight: bold;
        color: red;
      }
    </style>
  </head>

  <body>
    <div className="container">
      <h1 class="font1">This demonstrates Font Properties</h1>

      <p class="font2">This paragraph uses Georgia font.</p>

      <p class="font3">This paragraph uses Poppins font.</p>
    </div>
  </body>
</html>
