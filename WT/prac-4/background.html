<!doctype html>
<html>
  <head>
    <title>Background Properties</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background-color: #eaf4f4;
      }

      h1 {
        text-align: center;
        color: teal;
        margin: 25px;
      }

      .container {
        width: 650px;
        margin: auto;
        padding: 15px;
        background-color: white;
        border-radius: 12px;
      }

      .box {
        width: 650px;
        height: 350px;

        background-color: lightyellow;
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;

        border-radius: 8px;
      }

      .text {
        text-align: center;
        font-size: 18px;
        color: #333;
        margin-top: 12px;
      }
    </style>
  </head>

  <body>
    <h1>Background Properties</h1>

    <div class="container">
      <div class="box"></div>

      <div class="text">
        <b>Welcome!</b>
      </div>
    </div>
  </body>
</html>
