<!doctype html>
<html>
  <head>
    <title>Border Properties</title>

    <style>
      body {
        font-family: Arial, sans-serif;
      }
      div {
        width: 250px;
        height: 70px;
        margin: 15px;
        padding: 10px;
        background-color: lightgray;
      }

      .solid {
        border: 4px solid maroon;
      }

      .dotted {
        border: 4px dotted orange;
      }

      .dashed {
        border: 4px dashed green;
      }

      .double {
        border: 6px double purple;
      }
      .inset {
        border: 6px inset gray;
      }

      .outset {
        border: 6px outset black;
      }
    </style>
  </head>

  <body style="background-color: teal">
    <h1>Different Border Styles</h1>

    <div class="solid">Solid Border</div>
    <div class="dotted">Dotted Border</div>
    <div class="dashed">Dashed Border</div>
    <div class="double">Double Border</div>
    <div class="inset">Inset Border</div>
    <div class="outset">Outset Border</div>
  </body>
</html>
