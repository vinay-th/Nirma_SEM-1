<!doctype html>
<html>
  <head>
    <title>Transition of Square to Circle</title>
    <style>
      .animation-box {
        width: 100px;
        height: 100px;
        background-color: #4caf50;
        margin: 40px auto;
        animation: squareToCircle 3s infinite;
      }

      @keyframes squareToCircle {
        0% {
          border-radius: 0%;
          transform: rotate(0deg);
        }

        50% {
          border-radius: 50%;
          transform: rotate(180deg);
        }

        100% {
          border-radius: 0%;
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <h2 align="center">Square to Circle Animation</h2>

    <div class="animation-box"></div>
  </body>
</html>
