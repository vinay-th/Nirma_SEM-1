<html>
  <head>
    <title>Transition of Square to Circle</title>
    <style>
      .rectangle {
        width: 300px;
        height: 120px;
        background-color: grey;
        margin: 40px auto;
        transition: all 0.5s;
      }

      .rectangle:hover {
        box-shadow: 0 0 10px 5px yellowgreen;
        border-radius: 50%;
        background-color: maroon;
      }
    </style>
  </head>
  <body>
    <h2 align="center">Hover Over the Grey Rectangle</h2>
    <div class="rectangle"></div>
  </body>
</html>
